<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Diego Meleddu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Kalam&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="project-page">

<nav class="nav">
  <div class="container">
    <a href="index.html" class="logo"><span class="logo-mark">DM</span>Diego Meleddu</a>
    <button class="menu-btn" aria-label="Open menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#wip">In progress</a></li>
      <li><a href="index.html#projects">Projects</a></li>
      <li><a href="index.html#skills">Skills</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li><a data-cv class="nav-cv">CV ↓</a></li>
    </ul>
  </div>
</nav>

<main id="project"></main>

<footer>
  <div class="container mono">© <span data-year></span> Diego Meleddu · Gameplay Programmer</div>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="asset/extras.js"></script>
<script>
  const root = document.getElementById("project");
  const idx = PROJECTS.findIndex(p => p.id === new URLSearchParams(location.search).get("id"));

  if (idx === -1) {
    root.innerHTML = `
      <section class="container notfound">
        <span class="label mono">404 — Not found</span>
        <h1>Nothing on this workbench.</h1>
        <p>This project doesn't exist (yet).</p>
        <a href="index.html#projects" class="btn btn-primary">Back to projects</a>
      </section>`;
  } else {
    const p = PROJECTS[idx];
    const prev = PROJECTS[(idx - 1 + PROJECTS.length) % PROJECTS.length];
    const next = PROJECTS[(idx + 1) % PROJECTS.length];
    document.title = `${p.title} — ${SITE.name}`;

    let n = 0;
    const block = (title, content) => `
      <div class="block">
        <span class="block-index mono">${String(++n).padStart(2, "0")} — ${title.toUpperCase()}</span>
        <h2>${title}</h2>
        ${content}
      </div>`;
    const list = items => `<ul class="built-list">${items.map(i => `<li>${i}</li>`).join("")}</ul>`;

    const meta = [
      ["Role", p.role], ["Engine", p.engine], ["Language", p.language], ["Team", p.team],
      ["Duration", p.duration], ["Event", p.event], ["Platform", p.platform], ["Status", p.status]
    ].filter(([, v]) => v);

    const links = p.links || {};
    const actions = [
      links.itch && `<a class="btn btn-primary" href="${links.itch}" target="_blank" rel="noopener">Play on itch.io ↗</a>`,
      links.github && `<a class="btn btn-ghost" href="${links.github}" target="_blank" rel="noopener">Source on GitHub ↗</a>`,
      links.youtube && `<a class="btn btn-ghost" href="${links.youtube}" target="_blank" rel="noopener">Watch video ↗</a>`
    ].filter(Boolean).join("");

    root.innerHTML = `
      <section class="project-top">
        <div class="container">
          <a href="index.html#${p.type === "wip" ? "wip" : "projects"}" class="back-link mono">← Back to projects</a>
          <div class="project-header">
            <span class="label mono">${p.type === "wip" ? "On the workbench" : "Project"} — ${p.event || p.engine}</span>
            <h1>${p.title}</h1>
            <p class="project-lead">${p.summary}</p>
            ${tagsHTML(p.tags)}
            ${actions ? `<div class="btn-row">${actions}</div>` : ""}
          </div>

          <div class="project-media paper taped reveal">
            <div class="media-frame">${mediaHTML(p, { controls: true })}</div>
          </div>

          <div class="project-layout">
            <article class="project-main reveal">
              ${p.note ? `<div class="note">${p.note}</div>` : ""}
              ${p.overview?.length ? block("Overview", p.overview.map(t => `<p>${t}</p>`).join("")) : ""}
              ${p.compare ? block("Before / after", `
                <div class="compare" style="--pos: 50%">
                  <img src="${p.compare.before}" alt="${p.compare.beforeLabel || "Before"}">
                  <img class="compare-after" src="${p.compare.after}" alt="${p.compare.afterLabel || "After"}">
                  <span class="compare-line" aria-hidden="true"></span>
                  <span class="compare-tag compare-tag-l mono">${p.compare.beforeLabel || "Before"}</span>
                  <span class="compare-tag compare-tag-r mono">${p.compare.afterLabel || "After"}</span>
                  <input class="compare-range" type="range" min="0" max="100" value="50" aria-label="Before / after slider">
                </div>
                <p class="compare-hint hand-note">← drag to compare →</p>`) : ""}
              ${p.pipeline?.length ? block("How it works", `
                <div class="pipeline">${p.pipeline.map((s, i) => `
                  <div class="pipe-step${s.highlight ? " is-hl" : ""}"><span class="mono">${String(i + 1).padStart(2, "0")}</span><strong>${s.title}</strong><p>${s.text}</p></div>`).join('<span class="pipe-arrow" aria-hidden="true">→</span>')}
                </div>`) : ""}
              ${p.built?.length ? block("What I built", list(p.built)) : ""}
              ${p.extensions?.length ? block("Beyond the course", list(p.extensions)) : ""}
              ${p.breakdown?.length ? block("Technical breakdown", `<div class="breakdown">${p.breakdown.map(b => `
                <div class="breakdown-item"><h3>${b.title}</h3><p>${b.text}</p></div>`).join("")}</div>`) : ""}
              ${p.challenges?.length ? block("Challenges & solutions", `<div class="challenges">${p.challenges.map(c => `
                <div class="challenge"><h3>${c.problem}</h3><p>${c.solution}</p></div>`).join("")}</div>`) : ""}
              ${p.youtubeId ? block("Video", `<div class="yt-frame"><iframe src="https://www.youtube-nocookie.com/embed/${p.youtubeId}" title="${p.title} video" allowfullscreen loading="lazy"></iframe></div>`) : ""}
              ${p.gallery?.length ? block("Gallery", `<div class="gallery">${p.gallery.map(g => `
                <figure><img src="${g.src}" alt="${g.caption || p.title}" loading="lazy" onerror="const g=this.closest('.gallery'); this.closest('figure').remove(); if (!g.querySelector('figure')) g.closest('.block').remove();">${g.caption ? `<figcaption>${g.caption}</figcaption>` : ""}</figure>`).join("")}</div>`) : ""}
              ${p.code ? block("Code sample", `
                <div class="code-block">
                  <div class="code-head mono"><i></i><i></i><i></i>${p.code.title || ""}</div>
                  <pre><code>${esc(p.code.snippet)}</code></pre>
                </div>`) : ""}
              ${p.next?.length ? block("Next steps", `<ul class="next-list">${p.next.map(i => `<li>${i}</li>`).join("")}</ul>`) : ""}
              ${p.learned ? block("What I learned", `<p>${p.learned}</p>`) : ""}
            </article>
            <aside class="meta-panel paper taped reveal">
              <h4 class="mono">PROJECT INFO</h4>
              <dl>${meta.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
            </aside>
          </div>

          <nav class="project-nav">
            <a href="project.html?id=${prev.id}"><span>← PREVIOUS</span><strong>${prev.title}</strong></a>
            <a href="project.html?id=${next.id}"><span>NEXT →</span><strong>${next.title}</strong></a>
          </nav>
        </div>
      </section>`;
  }

  /* before / after slider */
  document.querySelectorAll(".compare").forEach(box => {
    const range = box.querySelector(".compare-range");
    range.addEventListener("input", () => box.style.setProperty("--pos", range.value + "%"));
  });

  applySiteLinks();
  initNav();
  initReveal();
</script>
</body>
</html>
